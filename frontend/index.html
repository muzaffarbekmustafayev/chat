<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Telegram Clone</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
            colors: {
              tg: {
                '900': 'rgba(var(--tg-900), <alpha-value>)', 
                '800': 'rgba(var(--tg-800), <alpha-value>)', 
                '700': 'rgba(var(--tg-700), <alpha-value>)', 
                '600': 'rgba(var(--tg-600), <alpha-value>)',
                '500': 'rgba(var(--tg-500), <alpha-value>)', 
                '400': 'rgba(var(--tg-400), <alpha-value>)', 
                '300': 'rgba(var(--tg-300), <alpha-value>)', 
                '200': 'rgba(var(--tg-200), <alpha-value>)',
                '100': 'rgba(var(--tg-100), <alpha-value>)', 
                'accent': 'rgba(var(--tg-accent), <alpha-value>)', 
                'accent-light': 'rgba(var(--tg-accent-light), <alpha-value>)',
                'accent-muted': 'rgba(var(--tg-accent-muted), <alpha-value>)', 
                'text-1': 'rgba(var(--tg-text-1), <alpha-value>)', 
                'text-2': 'rgba(var(--tg-text-2), <alpha-value>)',
                'text-3': 'rgba(var(--tg-text-3), <alpha-value>)', 
                'text-4': 'rgba(var(--tg-text-4), <alpha-value>)', 
                'online': '#22c55e',
                'tick': '#60a5fa', 
                'glass-border': 'var(--tg-glass-border)'
              }
            },
            backgroundImage: {
              'accent-gradient': 'linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%)',
              'msg-out-grad': 'var(--msg-out-grad)'
            },
            boxShadow: {
              'tg-sm': '0 2px 8px var(--tg-shadow)', 
              'tg-glow': '0 0 24px var(--tg-shadow-glow)',
              'tg-glow-sm': '0 0 12px var(--tg-shadow-glow-sm)', 
              'msg-out': '0 2px 8px rgba(37,99,235,0.25)',
              'msg-in': '0 2px 8px var(--tg-shadow)', 
              'avatar': '0 4px 12px var(--tg-shadow-avatar)'
            },
            borderRadius: { 'pill': '9999px', 'bubble': '18px', 'bubble-tl': '4px', 'bubble-tr': '4px' }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        *, *::before, *::after { box-sizing: border-box; }
        html, body, #root { height: 100%; overflow: hidden; }

        :root {
          /* Light Theme (Default) */
          --tg-900: 248, 250, 252; /* Slate 50 */
          --tg-800: 255, 255, 255; /* White */
          --tg-700: 241, 245, 249; /* Slate 100 */
          --tg-600: 226, 232, 240; /* Slate 200 */
          --tg-500: 212, 219, 229; /* Slate 300 */
          --tg-400: 148, 163, 184; /* Slate 400 */
          --tg-300: 100, 116, 139; /* Slate 500 */
          --tg-200: 71, 85, 105;   /* Slate 600 */
          --tg-100: 51, 65, 85;    /* Slate 700 */
          
          --tg-accent: 59, 130, 246;
          --tg-accent-light: 96, 165, 250;
          --tg-accent-muted: 219, 234, 254;
          
          --tg-text-1: 15, 23, 42;
          --tg-text-2: 51, 65, 85;
          --tg-text-3: 100, 116, 139;
          --tg-text-4: 148, 163, 184;
          
          --tg-glass-border: rgba(0, 0, 0, 0.08);
          --tg-shadow-glow: rgba(59, 130, 246, 0.15);
          --tg-shadow-glow-sm: rgba(59, 130, 246, 0.1);
          --tg-shadow: rgba(0,0,0,0.05);
          --tg-shadow-avatar: rgba(0,0,0,0.1);
          --msg-out-grad: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
        }

        .dark {
          /* Dark Theme */
          --tg-900: 10, 15, 24;  
          --tg-800: 14, 22, 33;  
          --tg-700: 19, 31, 46;  
          --tg-600: 23, 33, 43;  
          --tg-500: 30, 44, 58;  
          --tg-400: 36, 51, 68;  
          --tg-300: 43, 58, 77;  
          --tg-200: 54, 74, 96;  
          --tg-100: 74, 98, 120; 
          
          --tg-accent: 59, 130, 246;
          --tg-accent-light: 96, 165, 250;
          --tg-accent-muted: 30, 58, 95;
          
          --tg-text-1: 241, 245, 249;
          --tg-text-2: 148, 163, 184;
          --tg-text-3: 100, 116, 139;
          --tg-text-4: 71, 85, 105;
          
          --tg-glass-border: rgba(255, 255, 255, 0.06);
          --tg-shadow-glow: rgba(59, 130, 246, 0.3);
          --tg-shadow-glow-sm: rgba(59, 130, 246, 0.2);
          --tg-shadow: rgba(0,0,0,0.3);
          --tg-shadow-avatar: rgba(0,0,0,0.5);
          --msg-out-grad: linear-gradient(135deg, #2b5278 0%, #1d3f5e 100%);
        }

        body {
          @apply font-sans bg-tg-800 text-tg-text-1 antialiased transition-colors duration-300;
          background-image: radial-gradient(ellipse at top left, rgba(37,99,235,0.08) 0%, transparent 50%),
                            radial-gradient(ellipse at bottom right, rgba(59,130,246,0.05) 0%, transparent 50%);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-tg-300 rounded-pill; }
        ::-webkit-scrollbar-thumb:hover { @apply bg-tg-200; }
        ::selection { @apply bg-tg-accent/30 text-tg-text-1; }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0e1621 inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
      }

      @layer components {
        .avatar-base { @apply rounded-full object-cover flex-shrink-0 overflow-hidden shadow-avatar ring-2 ring-white/5; }
        .avatar-sm { @apply w-9 h-9 text-[12px]; }
        .avatar-md { @apply w-12 h-12 text-[14px]; }
        .avatar-lg { @apply w-16 h-16 text-[16px]; }
        .avatar-placeholder { @apply flex items-center justify-center font-semibold text-white/90 bg-accent-gradient; }

        .msg-out { @apply bg-msg-out-grad rounded-bubble rounded-tr-bubble-tr text-tg-text-1 shadow-msg-out ml-auto max-w-[80%] md:max-w-[420px] px-3 py-2 relative; }
        .msg-in { @apply bg-tg-500 rounded-bubble rounded-tl-bubble-tl text-tg-text-1 shadow-msg-in mr-auto max-w-[80%] md:max-w-[420px] px-3 py-2 relative; background-image: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, transparent 100%); }

        .btn-primary { @apply bg-accent-gradient text-white font-semibold px-6 py-2.5 rounded-xl shadow-tg-glow-sm transition-all duration-150 hover:shadow-tg-glow disabled:opacity-50 disabled:pointer-events-none; }
        .btn-icon-circle { @apply w-10 h-10 flex items-center justify-center rounded-full text-tg-text-2 hover:text-tg-text-1 hover:bg-tg-300/60 transition-all duration-150 flex-shrink-0; }
        .btn-icon-accent { @apply w-10 h-10 flex items-center justify-center rounded-full bg-accent-gradient text-white shadow-tg-glow-sm hover:shadow-tg-glow transition-all duration-150 flex-shrink-0; }
        
        .glass-card {
          @apply bg-tg-700/60 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .tg-input-wrapper {
          @apply relative flex items-center bg-tg-900/70 border border-white/10 rounded-2xl transition-all duration-300 focus-within:border-tg-accent focus-within:ring-4 focus-within:ring-tg-accent/20 focus-within:bg-tg-900/90 focus-within:shadow-tg-glow-sm;
        }

        .tg-input { @apply w-full bg-transparent border-none rounded-2xl px-4 py-3.5 text-sm text-tg-text-1 placeholder:text-tg-text-3 outline-none transition-all duration-200; }
      }

      @layer utilities {
        .text-xxs { font-size: 11px; line-height: 1.4; }
        .text-gradient { background: linear-gradient(135deg, #60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
